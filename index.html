<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outland</title>
    <style>
      :root {
        --yellow: #f5d000;
        --yellow-strong: #ffd400;
        --yellow-soft: #ffe97a;
        --dark: #111111;
        --bg: #f3f1ec;
        --panel: #ffffff;
        --line: rgba(17, 17, 17, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--dark);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 2px solid var(--line);
        padding-bottom: 18px;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo-wrap {
        width: 60px;
        height: 60px;
        position: relative;
        display: grid;
        place-items: center;
        background: var(--yellow);
        border: 3px solid var(--dark);
        transform: rotate(45deg);
        box-shadow: 6px 6px 0 var(--dark);
      }

      .logo-text {
        transform: rotate(-45deg);
        font-weight: 900;
        font-size: 1.7rem;
        letter-spacing: 0.04em;
      }

      .title-block {
        display: flex;
        flex-direction: column;
      }

      .title {
        font-size: clamp(2.1rem, 4vw, 3.4rem);
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: none;
      }

      .subtitle {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .tabs {
        display: inline-flex;
        gap: 12px;
        background: rgba(17, 17, 17, 0.04);
        border: 2px solid var(--dark);
        padding: 8px;
        border-radius: 18px;
      }

      .tab {
        border: 2px solid transparent;
        background: transparent;
        color: var(--dark);
        font-weight: 800;
        font-size: 1.05rem;
        border-radius: 12px;
        padding: 12px 18px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .tab.active {
        background: var(--yellow);
        border-color: var(--dark);
        box-shadow: 4px 4px 0 var(--dark);
      }

      .day-switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 14px 0 22px;
      }

      .day-btn {
        border: 2px solid var(--dark);
        background: #fff;
        color: var(--dark);
        font-weight: 800;
        font-size: 0.9rem;
        padding: 10px 14px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 220px;
        border: 3px solid var(--dark);
        border-radius: 18px;
        background: rgba(255,255,255,0.7);
        box-shadow: 8px 8px 0 var(--dark);
        text-align: center;
        font-size: clamp(1.4rem, 2vw, 2.1rem);
        font-weight: 900;
        padding: 30px 20px;
      }

      .day-btn.active {
        background: var(--yellow);
        box-shadow: 4px 4px 0 var(--dark);
      }

      .panel {
        display: none;
      }

      .panel.active {
        display: block;
      }

      .subject-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 22px;
        margin-top: 14px;
      }

      .subject-btn {
        position: relative;
        min-height: 170px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 26px 18px;
        background: var(--yellow);
        color: var(--dark);
        border: 3px solid var(--dark);
        box-shadow: 8px 8px 0 var(--dark);
        font-weight: 900;
        font-size: clamp(1.1rem, 2vw, 2rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
      }

      .subject-btn:hover {
        background: var(--yellow-soft);
        transform: translate(-2px, -2px);
        box-shadow: 12px 12px 0 var(--dark);
      }

      .subject-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 4px 4px 0 var(--dark);
      }

      .subject-btn.past {
        background: #d8d8d8;
        color: #4f4f4f;
        border-color: #6d6d6d;
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35);
        opacity: 0.7;
        filter: grayscale(0.3);
      }

      .subject-btn.past:hover {
        background: #d0d0d0;
      }

      .subject-number {
        position: absolute;
        top: 10px;
        left: 12px;
        min-width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 2px solid var(--dark);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        font-size: 0.75rem;
        font-weight: 900;
      }

      .utility-bar {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 18px;
        margin: 18px 0 26px;
      }

      .info-card {
        border: 2px solid var(--dark);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 6px 6px 0 var(--dark);
        padding: 18px 20px;
      }

      .info-label {
        display: block;
        font-size: 0.74rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 8px;
      }

      .info-value {
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        font-weight: 900;
        line-height: 1.3;
      }

      .schedule-wrap {
        background: rgba(255, 255, 255, 0.5);
        border: 2px solid var(--dark);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 8px 8px 0 var(--dark);
      }

      .schedule-header {
        padding: 18px 20px;
        background: var(--yellow);
        border-bottom: 2px solid var(--dark);
        font-size: clamp(1.5rem, 2vw, 2.2rem);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      thead th {
        background: #f8f3d0;
        border: 2px solid var(--dark);
        padding: 14px 12px;
        font-size: 1rem;
        text-transform: uppercase;
      }

      tbody td {
        border: 2px solid var(--dark);
        padding: 14px 12px;
        text-align: center;
        font-size: 0.98rem;
        background: rgba(255, 255, 255, 0.7);
      }

      tbody td:first-child {
        text-align: left;
        font-weight: 800;
        background: #fffbe3;
      }

      thead th.today {
        background: #ffe14d;
      }

      tbody td.today-cell {
        background: #fff0a8;
        font-weight: 900;
      }

      .secret-popup {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 1000;
        padding: 20px;
      }

      .secret-box {
        width: min(520px, 100%);
        background: #fff;
        border: 3px solid var(--dark);
        border-radius: 22px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        padding: 24px;
      }

      .secret-title {
        margin: 0 0 16px;
        font-size: 1.4rem;
        letter-spacing: 0.04em;
      }

      .secret-input {
        width: 100%;
        border: 2px solid var(--dark);
        border-radius: 14px;
        font-size: 1rem;
        padding: 14px 16px;
        margin-bottom: 16px;
      }

      .secret-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      .admin-panel {
        position: fixed;
        right: 20px;
        top: 80px;
        width: min(420px, calc(100% - 40px));
        max-height: calc(100vh - 120px);
        overflow: auto;
        background: #fff;
        border: 3px solid var(--dark);
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        padding: 20px;
        z-index: 900;
      }

      .admin-panel.hidden,
      .secret-popup.hidden {
        display: none !important;
      }

      .admin-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .admin-grid {
        display: grid;
        gap: 14px;
      }

      .admin-grid label {
        display: grid;
        gap: 10px;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.85rem;
      }

      .admin-grid input,
      .admin-grid textarea {
        width: 100%;
        border: 2px solid var(--dark);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 0.95rem;
      }

      .admin-grid textarea {
        resize: vertical;
        min-height: 220px;
      }

      .admin-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .device-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .device-list li {
        padding: 12px 14px;
        background: #f6f0b4;
        border: 2px solid var(--dark);
        border-radius: 14px;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .footer-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-top: 24px;
        font-weight: 600;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7a7a7a;
      }

      .dev-icon {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #8a8a8a;
        display: inline-block;
        box-shadow: 0 0 0 2px rgba(122, 122, 122, 0.2);
      }

      @media (max-width: 800px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .tabs {
          width: 100%;
          justify-content: center;
        }

        .utility-bar {
          grid-template-columns: 1fr;
        }

        .subject-grid {
          grid-template-columns: 1fr;
        }

        .subject-btn {
          min-height: 120px;
        }

        .schedule-wrap {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }

        table {
          min-width: 100%;
          table-layout: fixed;
        }

        thead th,
        tbody td {
          padding: 10px 8px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand" aria-label="Логотип Outland">
          <div class="logo-wrap">
            <div class="logo-text">O</div>
          </div>
          <div class="title-block">
            <div class="title">Outland</div>
            <div class="subtitle">10 школа м. Торецьк</div>
          </div>
        </div>

        <nav class="tabs" aria-label="Навігація сайту">
          <button class="tab active" type="button" data-target="subjects-panel">Предмети</button>
          <button class="tab" type="button" data-target="schedule-panel">Розклад</button>
        </nav>
      </header>

      <div class="utility-bar">
        <div class="info-card">
          <span class="info-label">Сьогодні</span>
          <div class="info-value" id="todayLabel">Понеділок</div>
        </div>
        <div class="info-card">
          <span class="info-label">Наступний урок</span>
          <div class="info-value" id="nextLessonLabel">Завантаження...</div>
        </div>
      </div>

      <div class="day-switcher" id="daySwitcher" aria-label="Перемикання днів"></div>

      <main>
        <section id="subjects-panel" class="panel active" aria-label="Предмети">
          <div class="subject-grid" id="subjectGrid"></div>
        </section>

        <section id="schedule-panel" class="panel" aria-label="Розклад">
          <div class="schedule-wrap">
            <div class="schedule-header" id="scheduleTitle">Розклад</div>
            <table>
              <thead>
                <tr>
                  <th>№</th>
                  <th>Час</th>
                  <th>Предмет</th>
                </tr>
              </thead>
              <tbody id="scheduleBody"></tbody>
            </table>
          </div>
        </section>
      </main>

      <div class="footer-note">
        <span class="dev-icon" aria-hidden="true"></span>
        <span>By YonoDev / Hlib</span>
      </div>
    </div>

    <div id="secretPopup" class="secret-popup hidden" aria-hidden="true">
      <div class="secret-box">
        <h2 class="secret-title">Секретна команда</h2>
        <input id="secretInput" class="secret-input" type="text" placeholder="inject command" autocomplete="off" />
        <div class="secret-actions">
          <button class="ghost-btn" id="secretCancel" type="button">Закрити</button>
          <button class="primary-btn" id="secretSubmit" type="button">Ввести</button>
        </div>
      </div>
    </div>

    <aside id="adminPanel" class="admin-panel hidden" aria-label="Адмін-панель">
      <div class="admin-panel-header">
        <h3>Адмін-панель</h3>
        <button class="ghost-btn" id="closeAdminPanel" type="button">Вихід</button>

          Підзаголовок

        </label>

      </div>
      <h4>Пристрої онлайн</h4>
      <ul id="deviceList" class="device-list"></ul>
    </aside>

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function openMeet(code = 'hjj-irbi-bfv') {
        const url = `https://meet.google.com/${code}`;
        
        if (/Android/i.test(navigator.userAgent)) {
          // Правильний Intent URI з fallback URL для Android
          const fallbackUrl = encodeURIComponent(url);
          const intentUrl = `intent://meet.google.com/${code}#Intent;scheme=https;package=com.google.android.apps.meetings;S.browser_fallback_url=${fallbackUrl};end`;
          window.location.href = intentUrl;
          return;
        }

        // Для iOS та десктопу
        window.open(url, '_blank', 'noopener,noreferrer');
      }

      function getKyivParts() {
        const formatter = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Kyiv',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = formatter.formatToParts(new Date());
        const values = {};
        parts.forEach((part) => {
          if (part.type !== 'literal') {
            values[part.type] = part.value;
          }
        });
        return {
          year: Number(values.year),
          month: Number(values.month),
          day: Number(values.day),
          hour: Number(values.hour),
          minute: Number(values.minute),
          second: Number(values.second)
        };
      }

      function getCurrentKyivDayName() {
        const { year, month, day } = getKyivParts();
        const utcDate = Date.UTC(year, month - 1, day);
        const jsDate = new Date(utcDate);
        return dayNames[(jsDate.getUTCDay() + 6) % 7] || 'Понеділок';
      }

      function getKyivMinutesNow() {
        const { hour, minute } = getKyivParts();
        return hour * 60 + minute;
      }

      function isWeekendNow() {
        return !dayNames.includes(getCurrentKyivDayName());
      }

      function getTimeMinutes(value) {
        const [hours, minutes] = value.split(':').map(Number);
        return hours * 60 + minutes;
      }

      function formatEndTime(startTime) {
        const endMinutes = getTimeMinutes(startTime) + lessonDuration;
        const hours = Math.floor(endMinutes / 60);
        const minutes = endMinutes % 60;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
      }

      function saveSelectedDay() {
        localStorage.setItem(STORAGE_KEYS.selectedDay, selectedDay);
      }

      function loadSelectedDay() {
        const savedDay = localStorage.getItem(STORAGE_KEYS.selectedDay);
        if (savedDay && dayNames.includes(savedDay)) {
          selectedDay = savedDay;
        }
      }

      function updateAdminUI() {
        document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
      }

      function showSecretPopup() {
        document.getElementById('secretPopup').classList.remove('hidden');
        document.getElementById('secretInput').value = '';
        setTimeout(() => document.getElementById('secretInput').focus(), 50);
      }

      function hideSecretPopup() {
        document.getElementById('secretPopup').classList.add('hidden');
      }

      function activateAdminMode() {
        isAdmin = true;
        localStorage.setItem(STORAGE_KEYS.adminMode, '1');
        updateAdminUI();
        hideSecretPopup();
      }

      function deactivateAdminMode() {
        isAdmin = false;
        localStorage.setItem(STORAGE_KEYS.adminMode, '0');
        updateAdminUI();
      }

      function handleSecretCommand(command) {
        const normalized = String(command || '').trim().toLowerCase();
        if (normalized === 'auth\\yono' || normalized === 'auth/yono') {
          activateAdminMode();
          return;
        }
        if (normalized.length) {
          alert('Невірна команда. Введіть auth\\yono');
        }
      }

      function renderDayButtons() {
        const daySwitcher = document.getElementById('daySwitcher');
        daySwitcher.innerHTML = '';

        if (isWeekendNow()) {
          daySwitcher.style.display = 'none';
          return;
        }

        daySwitcher.style.display = 'flex';

        dayNames.forEach((day) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `day-btn ${selectedDay === day ? 'active' : ''}`;
          btn.textContent = day;
          btn.addEventListener('click', () => {
            selectedDay = day;
            saveSelectedDay();
            refreshViews();
          });
          daySwitcher.appendChild(btn);
        });
      }

      function renderSubjects() {
        const subjectGrid = document.getElementById('subjectGrid');
        if (isWeekendNow()) {
          subjectGrid.innerHTML = '<div class="empty-state">Сьогодні вихідний, відпочивай..</div>';
          return;
        }

        const lessons = siteState.schedule[selectedDay] || [];
        const nowMinutes = getKyivMinutesNow();
        subjectGrid.innerHTML = '';

        lessons.forEach((lesson) => {
          const endMinutes = getTimeMinutes(lesson.time) + lessonDuration;
          const link = document.createElement('a');
          link.href = meetWebLink;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.className = 'subject-btn';
          link.addEventListener('click', (event) => {
            event.preventDefault();
            openMeet('hjj-irbi-bfv');
          });

          if (endMinutes <= nowMinutes) {
            link.classList.add('past');
          }

          const badge = document.createElement('span');
          badge.className = 'subject-number';
          badge.textContent = lesson.number;

          const label = document.createElement('span');
          label.textContent = lesson.subject;

          link.appendChild(badge);
          link.appendChild(label);
          subjectGrid.appendChild(link);
        });
      }

      function renderSchedule() {
        const scheduleBody = document.getElementById('scheduleBody');
        const scheduleTitle = document.getElementById('scheduleTitle');

        if (isWeekendNow()) {
          scheduleTitle.textContent = 'Розклад';
          scheduleBody.innerHTML = '';
          return;
        }

        const lessons = siteState.schedule[selectedDay] || [];
        scheduleTitle.textContent = `Розклад · ${selectedDay}`;
        scheduleBody.innerHTML = '';

        lessons.forEach((lesson) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${lesson.number}</td>
            <td>${lesson.time} - ${formatEndTime(lesson.time)}</td>
            <td>${lesson.subject}</td>
          `;
          scheduleBody.appendChild(row);
        });
      }

      function updateTodayCard() {
        const todayLabel = document.getElementById('todayLabel');
        const nextLessonLabel = document.getElementById('nextLessonLabel');
        const todayName = getCurrentKyivDayName();

        if (isWeekendNow()) {
          todayLabel.textContent = 'Вихідний';
          nextLessonLabel.textContent = '☕ Відпочивай';
          return;
        }

        todayLabel.textContent = todayName;
        const lessons = siteState.schedule[selectedDay] || [];
        const nowMinutes = getKyivMinutesNow();

        const activeLesson = lessons.find((lesson) => {
          const start = getTimeMinutes(lesson.time);
          const end = start + lessonDuration;
          return start <= nowMinutes && nowMinutes < end;
        });

        if (activeLesson) {
          nextLessonLabel.textContent = `🕒 ${activeLesson.subject} ${activeLesson.time} - ${formatEndTime(activeLesson.time)}`;
          return;
        }

        const nextLesson = lessons.find((lesson) => nowMinutes < getTimeMinutes(lesson.time));
        if (nextLesson) {
          nextLessonLabel.textContent = `🕒 ${nextLesson.subject} ${nextLesson.time}`;
          return;
        }

        nextLessonLabel.textContent = '✕ Немає уроків';
      }

      function refreshViews() {
        saveSelectedDay();
        document.querySelector('.title').textContent = siteState.pageTitle;
        document.querySelector('.subtitle').textContent = siteState.subtitle;
        document.title = siteState.pageTitle;
        renderDayButtons();
        renderSubjects();
        renderSchedule();
        updateTodayCard();
      }

      function fillAdminForm() {
        document.getElementById('adminTitleInput').value = siteState.pageTitle;
        document.getElementById('adminSubtitleInput').value = siteState.subtitle;
        document.getElementById('adminScheduleInput').value = JSON.stringify(siteState.schedule, null, 2);
      }

      async function saveAdminChanges() {
        let schedule;
        try {
          schedule = JSON.parse(document.getElementById('adminScheduleInput').value);
        } catch (error) {
          alert('Невірний JSON. Перевірте розклад.');
          return;
        }

        const nextState = {
          pageTitle: document.getElementById('adminTitleInput').value.trim() || 'Outland',
          subtitle: document.getElementById('adminSubtitleInput').value.trim() || '10 школа м. Торецьк',
          schedule,
          updatedAt: Date.now()
        };

        siteState = nextState;
        await set(ref(db, 'site/content'), nextState);
      }

      async function resetAdminChanges() {
        siteState = {
          pageTitle: 'Outland',
          subtitle: '10 школа м. Торецьк',
          schedule: clone(defaultSchedule),
          updatedAt: Date.now()
        };
        await set(ref(db, 'site/content'), siteState);
      }

      function updateDeviceList(devices) {
        const list = document.getElementById('deviceList');
        list.innerHTML = '';

        if (!devices || !Object.keys(devices).length) {
          list.innerHTML = '<li>Немає активних пристроїв</li>';
          return;
        }

        const activeDevices = Object.values(devices)
          .filter((device) => device && device.lastSeen && Date.now() - device.lastSeen < 45000)
          .sort((a, b) => b.lastSeen - a.lastSeen);

        if (!activeDevices.length) {
          list.innerHTML = '<li>Немає активних пристроїв</li>';
          return;
        }

        activeDevices.forEach((device) => {
          const item = document.createElement('li');
          const label = device.label || device.userAgent || 'браузер';
          const time = new Date(device.lastSeen).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
          item.textContent = `${label} • ${time}`;
          list.appendChild(item);
        });
      }

      function startPresence() {
        const clientId = crypto.randomUUID ? crypto.randomUUID() : `device-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const presenceRef = ref(db, `presence/${clientId}`);
        const payload = {
          label: navigator.platform || 'browser',
          userAgent: navigator.userAgent,
          lastSeen: Date.now()
        };

        set(presenceRef, payload);
        onDisconnect(presenceRef).remove();

        const heartbeat = setInterval(() => {
          set(presenceRef, { ...payload, lastSeen: Date.now() });
        }, 20000);

        window.addEventListener('beforeunload', () => {
          clearInterval(heartbeat);
          remove(presenceRef);
        });
      }

      function bindEvents() {
        tabs.forEach((tab) => {
          tab.addEventListener('click', () => {
            const target = tab.dataset.target;
            tabs.forEach((item) => item.classList.toggle('active', item === tab));
            panels.forEach((panel) => panel.classList.toggle('active', panel.id === target));
          });
        });

        document.getElementById('secretCancel').addEventListener('click', hideSecretPopup);
        document.getElementById('secretSubmit').addEventListener('click', () => {
          handleSecretCommand(document.getElementById('secretInput').value);
        });
        document.getElementById('secretInput').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') handleSecretCommand(event.target.value);
        });

        document.getElementById('closeAdminPanel').addEventListener('click', deactivateAdminMode);
        document.getElementById('saveAdminData').addEventListener('click', saveAdminChanges);
        document.getElementById('resetAdminData').addEventListener('click', resetAdminChanges);

        document.addEventListener('keydown', (event) => {
          if (event.key === 'ё' || event.key === '`' || event.key === '~') {
            event.preventDefault();
            showSecretPopup();
          }
        });
      }

      async function initDatabase() {
        try {
          const contentRef = ref(db, 'site/content');
          const snapshot = await get(contentRef);

          if (snapshot.exists()) {
            const data = snapshot.val();
            siteState = {
              pageTitle: data.pageTitle || 'Outland',
              subtitle: data.subtitle || '10 школа м. Торецьк',
              schedule: data.schedule && Object.keys(data.schedule).length ? data.schedule : clone(defaultSchedule)
            };
          } else {
            await set(contentRef, siteState);
          }

          onValue(contentRef, (snapshotValue) => {
            if (!snapshotValue.exists()) return;
            const data = snapshotValue.val();
            siteState = {
              pageTitle: data.pageTitle || 'Outland',
              subtitle: data.subtitle || '10 школа м. Торецьк',
              schedule: data.schedule && Object.keys(data.schedule).length ? data.schedule : clone(defaultSchedule)
            };
            fillAdminForm();
            refreshViews();
          });

          const presenceRef = ref(db, 'presence');
          onValue(presenceRef, (snapshotValue) => {
            updateDeviceList(snapshotValue.val() || {});
          });
        } catch (error) {
          console.error('Firebase init failed', error);
        }
      }

      loadSelectedDay();
      bindEvents();
      updateAdminUI();
      fillAdminForm();
      initDatabase();
      startPresence();
      refreshViews();
      setInterval(refreshViews, 30000);
    </script>
  </body>
</html>
